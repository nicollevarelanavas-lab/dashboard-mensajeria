<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Mensajería</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #1a2a47 0%, #2c3e50 100%);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            margin-bottom: 30px;
            animation: slideDown 0.6s ease-out;
            color: white;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 36px;
            color: white;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #b0b8c1;
            font-size: 14px;
            font-weight: 500;
        }

        .filtros-container {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            animation: slideUp 0.6s ease-out 0.1s both;
            border: 1px solid #e8eaed;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .filtros-titulo {
            font-size: 14px;
            font-weight: 700;
            color: #1a2a47;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .filtros {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .filtro-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filtro-label {
            font-size: 12px;
            color: #5f6368;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        select {
            padding: 12px 16px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            background: white;
            color: #202124;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', sans-serif;
        }

        select:hover {
            border-color: #2c3e50;
            box-shadow: 0 2px 8px rgba(44, 62, 80, 0.1);
        }

        select:focus {
            outline: none;
            border-color: #2c3e50;
            box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.1);
        }

        .main-content {
            display: grid;
            gap: 30px;
        }

        .kpis-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .kpi-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-top: 4px solid #2c3e50;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease-out 0.2s both;
            border: 1px solid #e8eaed;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .kpi-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
        }

        .kpi-card.general {
            border-top-color: #d32f2f;
            background: linear-gradient(135deg, #fafbfc 0%, #f5f7fa 100%);
        }

        .kpi-label {
            font-size: 12px;
            color: #5f6368;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .kpi-value {
            font-size: 48px;
            font-weight: 700;
            color: #2c3e50;
        }

        .kpi-card.general .kpi-value {
            color: #d32f2f;
            font-size: 56px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            animation: fadeInUp 0.6s ease-out 0.3s both;
            border: 1px solid #e8eaed;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a2a47;
            margin-bottom: 20px;
        }

        .chart-wrapper {
            position: relative;
            height: 350px;
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .table-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            animation: fadeInUp 0.6s ease-out 0.4s both;
            border: 1px solid #e8eaed;
        }

        .table-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a2a47;
            margin-bottom: 20px;
        }

        .table-wrapper {
            max-height: 400px;
            overflow-y: auto;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table thead {
            background: #f5f7fa;
            position: sticky;
            top: 0;
        }

        table th {
            padding: 14px 16px;
            text-align: left;
            color: #1a2a47;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 1px solid #dadce0;
        }

        table td {
            padding: 12px 16px;
            border-bottom: 1px solid #e8eaed;
            color: #202124;
        }

        table tbody tr {
            transition: all 0.2s ease;
        }

        table tbody tr:hover {
            background-color: #f9fafb;
        }

        table tbody tr:last-child td {
            border-bottom: none;
        }

        @media (max-width: 1024px) {
            .charts-grid,
            .tables-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 28px;
            }
        }

        @media (max-width: 768px) {
            .filtros {
                grid-template-columns: 1fr;
            }

            .kpis-row {
                grid-template-columns: 1fr;
            }

            .kpi-value {
                font-size: 36px;
            }

            .kpi-card.general .kpi-value {
                font-size: 42px;
            }

            .chart-wrapper {
                height: 280px;
            }
        }

        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #c62828;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid #ef5350;
        }

        .kpi-value {
            animation: fadeInScale 0.8s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard Mensajería</h1>
            <p>Seguimiento en tiempo real de envíos y lecturas</p>
        </div>

        <div id="error-container"></div>

        <div class="filtros-container">
            <div class="filtros-titulo">🔍 FILTROS</div>
            <div class="filtros">
                <div class="filtro-group">
                    <label class="filtro-label">Mes</label>
                    <select id="mes" onchange="aplicarFiltros()">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="filtro-group">
                    <label class="filtro-label">Semana</label>
                    <select id="semana" onchange="aplicarFiltros()">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="filtro-group">
                    <label class="filtro-label">Zona</label>
                    <select id="zona" onchange="aplicarFiltros()">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="filtro-group">
                    <label class="filtro-label">Pilar</label>
                    <select id="pilar" onchange="aplicarFiltros()">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="filtro-group">
                    <label class="filtro-label">Marca</label>
                    <select id="marca" onchange="aplicarFiltros()">
                        <option value="">Todas</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="kpis-row">
                <div class="kpi-card general">
                    <div class="kpi-label">📈 Lectura General</div>
                    <div class="kpi-value" id="general">0%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">💬 WhatsApp</div>
                    <div class="kpi-value" id="ws">0%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">📱 Viva
