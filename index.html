<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Mensajería</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #1a2a47 0%, #2c3e50 100%);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            margin-bottom: 30px;
            animation: slideDown 0.6s ease-out;
            color: white;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 36px;
            color: white;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #b0b8c1;
            font-size: 14px;
            font-weight: 500;
        }

        .filtros-container {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            animation: slideUp 0.6s ease-out 0.1s both;
            border: 1px solid #e8eaed;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .filtros-titulo {
            font-size: 14px;
            font-weight: 700;
            color: #1a2a47;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .filtros {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .filtro-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filtro-label {
            font-size: 12px;
            color: #5f6368;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        select {
            padding: 12px 16px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            background: white;
            color: #202124;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', sans-serif;
        }

        select:hover {
            border-color: #2c3e50;
            box-shadow: 0 2px 8px rgba(44, 62, 80, 0.1);
        }

        select:focus {
            outline: none;
            border-color: #2c3e50;
            box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.1);
        }

        .main-content {
            display: grid;
            gap: 30px;
        }

        .kpis-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 20px;
        }

        .kpi-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-top: 4px solid #2c3e50;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease-out 0.2s both;
            border: 1px solid #e8eaed;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .kpi-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
        }

        .kpi-card.general {
            border-top-color: #d32f2f;
            background: linear-gradient(135deg, #fafbfc 0%, #f5f7fa 100%);
        }

        .kpi-card.plan {
            border-top-color: #1976d2;
            background: linear-gradient(135deg, #fafbfc 0%, #f5f7fa 100%);
        }

        .kpi-label {
            font-size: 12px;
            color: #5f6368;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .kpi-value {
            font-size: 48px;
            font-weight: 700;
            color: #2c3e50;
        }

        .kpi-card.general .kpi-value {
            color: #d32f2f;
            font-size: 56px;
        }

        .kpi-card.plan .kpi-value {
            color: #1976d2;
            font-size: 56px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            animation: fadeInUp 0.6s ease-out 0.3s both;
            border: 1px solid #e8eaed;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a2a47;
            margin-bottom: 20px;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .table-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            animation: fadeInUp 0.6s ease-out 0.4s both;
            border: 1px solid #e8eaed;
        }

        .table-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a2a47;
            margin-bottom: 20px;
        }

        .table-wrapper {
            max-height: 400px;
            overflow-y: auto;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table thead {
            background: #f5f7fa;
            position: sticky;
            top: 0;
        }

        table th {
            padding: 14px 16px;
            text-align: left;
            color: #1a2a47;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 1px solid #dadce0;
        }

        table td {
            padding: 12px 16px;
            border-bottom: 1px solid #e8eaed;
            color: #202124;
        }

        table tbody tr {
            transition: all 0.2s ease;
        }

        table tbody tr:hover {
            background-color: #f9fafb;
        }

        table tbody tr:last-child td {
            border-bottom: none;
        }

        @media (max-width: 1024px) {
            .charts-grid,
            .tables-grid {
                grid-template-columns: 1fr;
            }

            .kpis-row {
                grid-template-columns: 1fr 1fr;
            }

            .header h1 {
                font-size: 28px;
            }
        }

        @media (max-width: 768px) {
            .filtros {
                grid-template-columns: 1fr;
            }

            .kpis-row {
                grid-template-columns: 1fr;
            }

            .kpi-value {
                font-size: 36px;
            }

            .kpi-card.general .kpi-value,
            .kpi-card.plan .kpi-value {
                font-size: 42px;
            }

            .chart-wrapper {
                height: 250px;
            }
        }

        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #c62828;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid #ef5350;
        }

        .kpi-value {
            animation: fadeInScale 0.8s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard Mensajería</h1>
            <p>Seguimiento en tiempo real de envíos y lecturas</p>
        </div>

        <div id="error-container"></div>

        <div class="filtros-container">
            <div class="filtros-titulo">🔍 FILTROS</div>
            <div class="filtros">
                <div class="filtro-group">
                    <label class="filtro-label">Mes</label>
                    <select id="mes" onchange="aplicarFiltros()">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="filtro-group">
                    <label class="filtro-label">Semana</label>
                    <select id="semana" onchange="aplicarFiltros()">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="filtro-group">
                    <label class="filtro-label">Zona</label>
                    <select id="zona" onchange="aplicarFiltros()">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="filtro-group">
                    <label class="filtro-label">Pilar</label>
                    <select id="pilar" onchange="aplicarFiltros()">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="filtro-group">
                    <label class="filtro-label">Marca</label>
                    <select id="marca" onchange="aplicarFiltros()">
                        <option value="">Todas</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="kpis-row">
                <div class="kpi-card general">
                    <div class="kpi-label">📈 Lectura General</div>
                    <div class="kpi-value" id="general">0%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">💬 WhatsApp</div>
                    <div class="kpi-value" id="ws">0%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">📱 Viva Engage</div>
                    <div class="kpi-value" id="ve">0%</div>
                </div>
                <div class="kpi-card plan">
                    <div class="kpi-label">✅ Cumplimiento Plan</div>
                    <div class="kpi-value" id="ejecucionPlan">0%</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <div class="chart-title">Lectura por Zona</div>
                    <div class="chart-wrapper">
                        <canvas id="zonaChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Lectura por Marca</div>
                    <div class="chart-wrapper">
                        <canvas id="marcaChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="tables-grid">
                <div class="table-card">
                    <div class="table-title">📍 Detalle por Zona</div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Zona</th>
                                    <th>% Lectura</th>
                                </tr>
                            </thead>
                            <tbody id="tz"></tbody>
                        </table>
                    </div>
                </div>
                <div class="table-card">
                    <div class="table-title">🏷️ Detalle por Marca</div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Marca</th>
                                    <th>% Lectura</th>
                                    <th>Planificado</th>
                                    <th>Ejecutado</th>
                                </tr>
                            </thead>
                            <tbody id="tm"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const URL = 'https://opensheet.elk.sh/1RC1VLZsbR0hpH8XuQUPT78A5RZDgiqyj6euXyxWROmQ/DATOS';
        let datosCompletos = [];
        let zc, mc;

        fetch(URL)
            .then(r => r.json())
            .then(d => {
                datosCompletos = d;
                llenarFiltros();
                aplicarFiltros();
            })
            .catch(err => {
                document.getElementById('error-container').innerHTML = 
                    `<div class="error-msg">Error al cargar datos: ${err.message}</div>`;
            });

        function llenarFiltros() {
            const meses = [...new Set(datosCompletos.map(r => r.Mes))].filter(Boolean).sort();
            const semanas = [...new Set(datosCompletos.map(r => r.Semana))].filter(Boolean).sort((a, b) => a - b);
            const zonas = [...new Set(datosCompletos.map(r => r.Zona))].filter(Boolean).sort();
            const pilares = [...new Set(datosCompletos.map(r => r.Pilar))].filter(Boolean).sort();
            const marcas = [...new Set(datosCompletos.map(r => r.Marca))].filter(Boolean).sort();

            const selects = {
                'mes': meses,
                'semana': semanas.map(s => ({ val: s, label: `Semana ${s}` })),
                'zona': zonas,
                'pilar': pilares,
                'marca': marcas
            };

            Object.entries(selects).forEach(([id, opciones]) => {
                const select = document.getElementById(id);
                opciones.forEach(opt => {
                    const el = document.createElement('option');
                    el.value = typeof opt === 'object' ? opt.val : opt;
                    el.textContent = typeof opt === 'object' ? opt.label : opt;
                    select.appendChild(el);
                });
            });
        }

        function aplicarFiltros() {
            const mes = document.getElementById('mes').value;
            const semana = document.getElementById('semana').value;
            const zona = document.getElementById('zona').value;
            const pilar = document.getElementById('pilar').value;
            const marca = document.getElementById('marca').value;

            const datos = datosCompletos.filter(r =>
                (!mes || r.Mes === mes) &&
                (!semana || r.Semana === semana) &&
                (!zona || r.Zona === zona) &&
                (!pilar || r.Pilar === pilar) &&
                (!marca || r.Marca === marca)
            );

            renderizar(datos);
        }

        function pct(a, b) {
            return b ? Math.round(a / b * 100) : 0;
        }

        function renderizar(datos) {
            if (datos.length === 0) {
                document.getElementById('general').innerText = '0%';
                document.getElementById('ws').innerText = '0%';
                document.getElementById('ve').innerText = '0%';
                document.getElementById('ejecucionPlan').innerText = '0%';
                document.getElementById('tz').innerHTML = '';
                document.getElementById('tm').innerHTML = '';
                return;
            }

            let ews = 0, lws = 0, eve = 0, lve = 0;
            datos.forEach(r => {
                ews += +r.Envios_WS || 0;
                lws += +r.Leidos_WS || 0;
                eve += +r.Envios_VivaEngage || 0;
                lve += +r.Leidos_VivaEngage || 0;
            });

            document.getElementById('ws').innerText = pct(lws, ews) + '%';
            document.getElementById('ve').innerText = pct(lve, eve) + '%';
            document.getElementById('general').innerText = pct(lws + lve, ews + eve) + '%';
            
            // % Cumplimiento del plan
            const totalEnvios = ews + eve;
            document.getElementById('ejecucionPlan').innerText = (totalEnvios > 0 ? '100' : '0') + '%';

            let z = {}, m = {};
            datos.forEach(r => {
                let p = pct((+r.Leidos_WS || 0) + (+r.Leidos_VivaEngage || 0), (+r.Envios_WS || 0) + (+r.Envios_VivaEngage || 0));
                z[r.Zona] = (z[r.Zona] || []).concat([p]);
                m[r.Marca] = (m[r.Marca] || []).concat([p]);
            });

            let za = Object.entries(z).map(([k, v]) => [k, Math.round(v.reduce((a, b) => a + b, 0) / v.length)]).sort((a, b) => b[1] - a[1]);
            let ma = Object.entries(m).map(([k, v]) => [k, Math.round(v.reduce((a, b) => a + b, 0) / v.length)]).sort((a, b) => b[1] - a[1]);

            const ctx1 = document.getElementById('zonaChart').getContext('2d');
            const gradient1 = ctx1.createLinearGradient(0, 0, 0, 400);
            gradient1.addColorStop(0, 'rgba(44, 62, 80, 0.8)');
            gradient1.addColorStop(1, 'rgba(52, 73, 94, 0.3)');

            if (zc) zc.destroy();
            zc = new Chart(zonaChart, {
                type: 'bar',
                data: {
                    labels: za.map(x => x[0]),
                    datasets: [{
                        label: '% Lectura',
                        data: za.map(x => x[1]),
                        backgroundColor: gradient1,
                        borderColor: '#2c3e50',
                        borderWidth: 2,
                        borderRadius: 12,
                        borderSkipped: false,
                        barThickness: 25,
                        maxBarThickness: 30
                    }]
                },
                options: {
                    indexAxis: 'y',
                    plugins: { 
                        legend: { display: false },
                        filler: { propagate: true }
                    },
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 1000,
                        easing: 'easeInOutQuart'
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            max: 100,
                            ticks: { callback: v => v + '%', color: '#5f6368' },
                            grid: { drawBorder: false, color: 'rgba(0, 0, 0, 0.05)' }
                        },
                        y: {
                            grid: { display: false },
                            ticks: { color: '#202124' }
                        }
                    }
                },
                plugins: [{
                    afterDatasetsDraw(chart) {
                        const {ctx, data, chartArea: {left, top, width, height}} = chart;
                        ctx.font = 'bold 11px Segoe UI';
                        ctx.fillStyle = '#2c3e50';
                        ctx.textAlign = 'end';
                        
                        chart.data.datasets.forEach((dataset, i) => {
                            chart.getDatasetMeta(i).data.forEach((datapoint, index) => {
                                const {x, y} = datapoint.tooltipPosition();
                                ctx.fillText(dataset.data[index] + '%', x - 8, y + 4);
                            });
                        });
                    }
                }]
            });

            const ctx2 = document.getElementById('marcaChart').getContext('2d');
            const gradient2 = ctx2.createLinearGradient(0, 0, 0, 400);
            gradient2.addColorStop(0, 'rgba(52, 73, 94, 0.8)');
            gradient2.addColorStop(1, 'rgba(70, 89, 110, 0.3)');

            if (mc) mc.destroy();
            mc = new Chart(marcaChart, {
                type: 'bar',
                data: {
                    labels: ma.map(x => x[0]),
                    datasets: [{
                        label: '% Lectura',
                        data: ma.map(x => x[1]),
                        backgroundColor: gradient2,
                        borderColor: '#34495e',
                        borderWidth: 2,
                        borderRadius: 12,
                        borderSkipped: false,
                        barThickness: 25,
                        maxBarThickness: 30
                    }]
                },
                options: {
                    indexAxis: 'y',
                    plugins: { 
                        legend: { display: false },
                        filler: { propagate: true }
                    },
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 1000,
                        easing: 'easeInOutQuart'
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            max: 100,
                            ticks: { callback: v => v + '%', color: '#5f6368' },
                            grid: { drawBorder: false, color: 'rgba(0, 0, 0, 0.05)' }
                        },
                        y: {
                            grid: { display: false },
                            ticks: { color: '#202124' }
                        }
                    }
                },
                plugins: [{
                    afterDatasetsDraw(chart) {
                        const {ctx, data, chartArea: {left, top, width, height}} = chart;
                        ctx.font = 'bold 11px Segoe UI';
                        ctx.fillStyle = '#2c3e50';
                        ctx.textAlign = 'end';
                        
                        chart.data.datasets.forEach((dataset, i) => {
                            chart.getDatasetMeta(i).data.forEach((datapoint, index) => {
                                const {x, y} = datapoint.tooltipPosition();
                                ctx.fillText(dataset.data[index] + '%', x - 8, y + 4);
                            });
                        });
                    }
                }]
            });

            document.getElementById('tz').innerHTML = za.map(x => `<tr><td>${x[0]}</td><td><strong>${x[1]}%</strong></td></tr>`).join('');
            
            // Agrupar datos de planificación y ejecución por marca
            let planEjec = {};
            datos.forEach(r => {
                if (!planEjec[r.Marca]) {
                    planEjec[r.Marca] = { planificado: 0, ejecutado: 0 };
                }
                planEjec[r.Marca].planificado += parseInt(r.Planificado_Marca) || 0;
                planEjec[r.Marca].ejecutado += parseInt(r.Ejecutado_Marca) || 0;
            });

            document.getElementById('tm').innerHTML = ma.map(x => {
                const plan = planEjec[x[0]]?.planificado || 0;
                const exec = planEjec[x[0]]?.ejecutado || 0;
                return `<tr><td>${x[0]}</td><td><strong>${x[1]}%</strong></td><td>${plan}</td><td>${exec}</td></tr>`;
            }).join('');
        }
    </script>
</body>
</html>
